<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PP-StructureV3 版面结构化演示</title>
    <link rel="stylesheet" href="/frontend/css/app.css" />
  </head>
  <body>
    <header>
      <h1>PP-StructureV3 版面结构化演示</h1>
      <span class="tag">版面检测 + PDF 表格结构提取</span>
      <span id="modelStatus" class="tag" style="background: #ff9800"
        >模型加载中...</span
      >
      <label class="model-picker">
        模型
        <select id="modelSelect" disabled>
          <option>加载中...</option>
        </select>
      </label>
      <div style="flex: 1"></div>
      <label
        class="btn"
        style="background: #e94560; color: #fff; cursor: pointer"
      >
        上传文件
        <input
          type="file"
          id="headerFileInput"
          accept=".pdf,.png,.jpg,.jpeg,.bmp,.gif"
          style="display: none"
        />
      </label>
    </header>

    <div class="container">
      <div class="sidebar" id="sidebar"></div>

      <div class="preview" id="preview">
        <div class="upload-zone" id="uploadZone">
          <div class="upload-box" id="uploadBox">
            <div class="icon">📄</div>
            <p>点击或拖拽上传 PDF / 图片</p>
            <input
              type="file"
              id="fileInput"
              accept=".pdf,.png,.jpg,.jpeg,.bmp,.gif"
            />
          </div>
        </div>
      </div>

      <div class="result-panel" id="resultPanel">
        <div class="resize-handle" id="resizeHandle"></div>
        <div class="result-header">
          <span>检测结果</span><span id="sourceTag"></span>
          <div style="display: flex; align-items: center; gap: 8px">
            <div class="view-switch">
              <span class="active" onclick="switchResultView('visual')"
                >可视化</span
              >
              <span onclick="switchResultView('json')">JSON</span>
              <span onclick="switchResultView('json-all')" id="jsonAllTab" style="display:none">全文档</span>
            </div>
            <button class="btn btn-primary" id="detectBtn" disabled>
              检测当前页
            </button>
            <button class="btn-detect-all" id="detectAllBtn" disabled>
              全部检测
            </button>
          </div>
        </div>
        <div id="detectAllProgress" style="display:none"></div>
        <div class="result-list" id="resultList">
          <div class="loading">上传文件后开始检测</div>
        </div>
        <div class="json-view" id="jsonView"></div>
        <div class="json-view" id="jsonAllView" style="display:none"></div>
        <section class="metrics-panel" id="metricsPanel">
          <div class="metrics-title">实验指标</div>
          <div class="metrics-content" id="metricsContent">
            <div class="metrics-empty">加载评测结果...</div>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="/frontend/js/app.js"></script>
  </body>
</html>
